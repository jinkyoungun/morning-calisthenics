<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#182738" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="아침 맨몸운동" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <title>아침 맨몸운동</title>
  <meta name="description" content="초심자를 위한 주 5일 아침 전신 맨몸운동 체크리스트" />
  <style>
    :root{--bg:#f3f5f7;--card:#fff;--ink:#17202a;--sub:#667085;--accent:#ef6c35;--navy:#182738;--line:#e5e8ec;--green:#16794b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;font-size:16px;line-height:1.45}
    button,a{font:inherit}.app{max-width:620px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px 110px}.top{background:var(--navy);color:#fff;border-radius:22px;padding:20px;box-shadow:0 12px 30px #18273822}.eyebrow{font-size:.82rem;color:#f7b08f;font-weight:800;letter-spacing:.08em}.top h1{margin:5px 0 5px;font-size:1.55rem}.top p{margin:0;color:#cdd5df;font-size:.93rem}.week{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:16px 0}.day{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 2px;font-weight:800;color:#556070}.day.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 15px #ef6c3540}.summary{display:flex;justify-content:space-between;align-items:end;margin:14px 2px 10px}.summary h2{font-size:1.2rem;margin:0}.meta{font-size:.84rem;color:var(--sub)}.progress{height:8px;background:#dfe4e8;border-radius:9px;overflow:hidden;margin-bottom:15px}.progress i{display:block;height:100%;width:0;background:var(--green);transition:.25s}.section{margin:18px 0 9px;font-size:.83rem;font-weight:900;color:#6a7280;letter-spacing:.06em}.exercise{display:grid;grid-template-columns:34px 1fr auto;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 12px;margin:9px 0;box-shadow:0 4px 14px #1d293908}.check{width:27px;height:27px;border:2px solid #b9c1ca;border-radius:50%;background:#fff;color:#fff;font-weight:900}.exercise.done{opacity:.64}.exercise.done .check{background:var(--green);border-color:var(--green)}.name{font-weight:850}.detail{font-size:.84rem;color:var(--sub);margin-top:3px}.video{display:inline-flex;align-items:center;text-decoration:none;background:#fff3ed;color:#bd4c1c;border:1px solid #ffd8c5;padding:8px 10px;border-radius:10px;font-size:.82rem;font-weight:850;white-space:nowrap}.note{background:#e9f2ff;border-left:4px solid #3478c4;border-radius:10px;padding:12px 13px;margin-top:16px;color:#35475a;font-size:.88rem}.reset{width:100%;margin-top:18px;padding:13px;border-radius:13px;border:1px solid var(--line);background:#fff;color:#596273;font-weight:800}.timerbar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#ffffffed;backdrop-filter:blur(10px);border-top:1px solid var(--line)}.timerinner{max-width:588px;margin:auto;display:flex;align-items:center;gap:10px}.time{font-size:1.3rem;font-weight:900;min-width:66px}.timerbtn{flex:1;border:0;border-radius:12px;padding:12px;background:var(--navy);color:#fff;font-weight:850}.timerbtn.secondary{flex:0 0 66px;background:#e8ecf0;color:#344050}@media(max-width:370px){.app{padding-left:10px;padding-right:10px}.video{padding:7px}.exercise{grid-template-columns:31px 1fr auto;gap:8px}}@media(display-mode:standalone){body{overscroll-behavior-y:none}.top{border-radius:18px}}
  </style>
</head>
<body><main class="app">
  <header class="top"><div class="eyebrow">12개월 프로젝트 · 1–4주차</div><h1>아침 맨몸운동</h1><p>전신 근력 · 등·허리 코어 강화</p></header>
  <nav class="week" id="week" aria-label="요일 선택"></nav>
  <div class="summary"><div><div class="meta" id="dayLabel"></div><h2 id="title"></h2></div><div class="meta" id="count"></div></div>
  <div class="progress"><i id="bar"></i></div><div id="list"></div>
  <div class="note">통증 없는 범위에서 진행하세요. 날카로운 관절·허리 통증, 다리 저림, 가슴 통증이나 어지럼이 생기면 즉시 중단합니다.</div>
  <button class="reset" id="reset">오늘 체크 초기화</button>
  </main>
  <div class="timerbar"><div class="timerinner"><div class="time" id="time">00:40</div><button class="timerbtn" id="timer">40초 시작</button><button class="timerbtn secondary" id="rest">60초</button></div></div>
<script>
const V={warm:'https://www.youtube.com/watch?v=U6nnxml9GRs',cool:'https://www.youtube.com/watch?v=2j9SRYlolfQ',squat:'https://www.youtube.com/watch?v=rVHkvL1TtNA',push:'https://www.youtube.com/results?search_query=벽+푸시업+초보+정확한+자세',incline:'https://www.youtube.com/results?search_query=책상+인클라인+푸시업+초보+정확한+자세',bridge:'https://www.acefitness.org/resources/everyone/exercise-library/49/glute-bridge/',bird:'https://www.youtube.com/watch?v=1qMJVPhikPc',snow:'https://www.youtube.com/results?search_query=리버스+스노우엔젤+정확한+자세',plank:'https://www.youtube.com/results?search_query=무릎+플랭크+초보+정확한+자세',walk:'https://www.youtube.com/results?search_query=초보+저충격+제자리걷기+운동',step:'https://www.youtube.com/results?search_query=스텝터치+유산소+초보',knee:'https://www.youtube.com/results?search_query=스탠딩+니업+초보+운동',dead:'https://www.youtube.com/watch?v=EHn2WswT5uU',side:'https://www.youtube.com/results?search_query=무릎+사이드+플랭크+초보+정확한+자세',split:'https://www.youtube.com/results?search_query=의자+보조+스플릿+스쿼트+초보',hinge:'https://www.youtube.com/watch?v=B5BrwCcYDi0',yt:'https://www.youtube.com/results?search_query=엎드린+YT+운동+등+초보',cat:'https://www.youtube.com/results?search_query=캣카우+정확한+자세+물리치료사',thoracic:'https://www.youtube.com/results?search_query=누워서+흉추+회전+스트레칭',wall:'https://www.youtube.com/watch?v=VRpWvYiYNKs',hip:'https://www.youtube.com/results?search_query=고관절+앞쪽+장요근+스트레칭+정확한+자세',row:'https://www.youtube.com/watch?v=QPvYrfyGHi8'};
const x=(name,dose,cue,video,section='본운동')=>({name,dose,cue,video,section});
const commonStart=x('전신 워밍업','영상 처음 5분','천천히 몸을 깨웁니다',V.warm,'준비운동');
const commonEnd=x('전신 마무리 스트레칭','5분','호흡을 편안하게 낮춥니다',V.cool,'마무리');
const plans=[
{d:'월',title:'전신 근력 A',round:'본운동 2바퀴',items:[commonStart,x('의자 스쿼트','10–15회','의자를 가볍게 터치',V.squat),x('벽 푸시업','8–12회','머리부터 발까지 일직선',V.push),x('글루트 브리지','12–15회','허리보다 엉덩이로 들기',V.bridge),x('버드독','좌우 6–8회','골반이 돌아가지 않게',V.bird),x('리버스 스노우엔젤','8–10회','어깨를 으쓱하지 않기',V.snow),x('무릎 플랭크','15–25초','배에 힘주고 호흡하기',V.plank),commonEnd]},
{d:'화',title:'저충격 유산소·코어',round:'본운동 2바퀴',items:[commonStart,x('제자리 걷기','40초','팔도 함께 움직이기',V.walk),x('스텝터치','40초','좌우로 가볍게 이동',V.step),x('스탠딩 니업','40초','허리를 구부리지 않기',V.knee),x('의자 스쿼트','10–15회','빠르지 않게 진행',V.squat),x('데드버그','좌우 6–8회','허리가 뜨지 않는 범위',V.dead),x('무릎 사이드 플랭크','좌우 15–20초','어깨 아래 팔꿈치',V.side),x('로잉머신 기초 유산소','8–10분','대화 가능한 편안한 강도',V.row,'로잉머신'),commonEnd]},
{d:'수',title:'전신 근력 B',round:'본운동 2바퀴',items:[commonStart,x('보조 스플릿 스쿼트','좌우 6–8회','의자를 잡고 짧게 시작',V.split),x('인클라인 푸시업','8–12회','튼튼한 책상을 사용',V.incline),x('굿모닝 힙힌지','10–12회','엉덩이를 뒤로 보내기',V.hinge),x('엎드린 Y–T','각각 6–8회','목에 힘을 주지 않기',V.yt),x('데드버그','좌우 6–8회','복부 긴장 유지',V.dead),x('무릎 사이드 플랭크','좌우 15–20초','골반이 뒤로 빠지지 않게',V.side),commonEnd]},
{d:'목',title:'회복·등·허리 코어',round:'천천히 1바퀴',items:[x('가벼운 제자리 걷기','3분','몸이 따뜻해질 정도',V.walk,'준비운동'),x('캣카우','8회','통증 없는 범위',V.cat),x('누워서 흉추 회전','좌우 8회','골반을 편안하게 유지',V.thoracic),x('버드독','좌우 8회','천천히 뻗고 잠시 정지',V.bird),x('글루트 브리지','15회','위에서 엉덩이를 1초 조이기',V.bridge),x('월슬라이드','8–10회','어깨가 아프면 범위 축소',V.wall),x('고관절 앞쪽 스트레칭','좌우 30초','허리를 꺾지 않기',V.hip),commonEnd]},
{d:'금',title:'전신 근력 C＋심폐',round:'본운동 2바퀴',items:[commonStart,x('의자 스쿼트','12–15회','무릎과 발끝 방향 일치',V.squat),x('인클라인 푸시업','8–12회','가슴을 책상 쪽으로',V.incline),x('글루트 브리지','15회','허리를 과하게 들지 않기',V.bridge),x('리버스 스노우엔젤','10회','등 위쪽 움직임에 집중',V.snow),x('버드독','좌우 8회','몸통이 흔들리지 않게',V.bird),x('무릎 플랭크','20–30초','숨을 참지 않기',V.plank),x('로잉머신 가벼운 인터벌','40초 일정하게＋20초 천천히 × 6','허리보다 다리로 먼저 밀기',V.row,'심폐 마무리'),commonEnd]}];
let selected=Math.min(Math.max(new Date().getDay()-1,0),4);let timerId=null,remaining=40;
const key=i=>`morning-fit-${selected}-${i}`;
function render(){week.innerHTML=plans.map((p,i)=>`<button class="day ${i===selected?'active':''}" data-i="${i}">${p.d}</button>`).join('');const p=plans[selected];dayLabel.textContent=`${p.d}요일 · ${p.round}`;title.textContent=p.title;let last='';list.innerHTML=p.items.map((e,i)=>{const sec=e.section!==last?`<div class="section">${last=e.section}</div>`:'';const done=localStorage.getItem(key(i))==='1';return sec+`<article class="exercise ${done?'done':''}" data-i="${i}"><button class="check" aria-label="${e.name} 완료 체크">${done?'✓':''}</button><div><div class="name">${e.name}</div><div class="detail">${e.dose} · ${e.cue}</div></div><a class="video" href="${e.video}" target="_blank" rel="noopener">영상 ↗</a></article>`}).join('');update();}
function update(){const all=[...document.querySelectorAll('.exercise')],done=all.filter(e=>e.classList.contains('done')).length;count.textContent=`${done} / ${all.length} 완료`;bar.style.width=`${done/all.length*100}%`;}
week.addEventListener('click',e=>{if(e.target.dataset.i!==undefined){selected=+e.target.dataset.i;render()}});list.addEventListener('click',e=>{const b=e.target.closest('.check');if(!b)return;const a=b.closest('.exercise'),i=a.dataset.i,done=!a.classList.contains('done');a.classList.toggle('done',done);b.textContent=done?'✓':'';localStorage.setItem(key(i),done?'1':'0');update()});reset.onclick=()=>{plans[selected].items.forEach((_,i)=>localStorage.removeItem(key(i)));render()};
function startTimer(sec){clearInterval(timerId);remaining=sec;paint();timer.textContent='일시정지';timerId=setInterval(()=>{remaining--;paint();if(remaining<=0){clearInterval(timerId);timerId=null;timer.textContent='40초 시작';if(navigator.vibrate)navigator.vibrate([150,100,150])}},1000)}function paint(){time.textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`};timer.onclick=()=>{if(timerId){clearInterval(timerId);timerId=null;timer.textContent='계속하기'}else startTimer(remaining||40)};rest.onclick=()=>startTimer(60);render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'))}
</script></body></html>
